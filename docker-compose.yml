# --- Shared config for the seven NestJS apps -------------------------------
# They all run the SAME image (built once from ./Dockerfile) and differ only by
# the `command:` that picks which bundle to run. The apps live behind the `apps`
# compose profile, so `docker compose up` still starts ONLY infra (kafka+pg) for
# the usual dev workflow (apps via `npm run start:dev -- <app>`), while
# `docker compose --profile apps up` brings up the whole system. See the Makefile.
#
# Host ports are overridable (e.g. in a git-ignored .env next to this file) for
# when something else on the machine already holds one: GATEWAY_PORT (5050),
# MONITOR_PORT (4000), FRONTEND_PORT (3001), POSTGRES_HOST_PORT (5432),
# KAFKA_HOST_PORT (9092). Container-internal ports never change.
x-app-env: &app-env
  # In-network addresses: apps reach Kafka on its INTERNAL listener and Postgres
  # by service name. (On the host, the same code defaults to localhost:9092.)
  KAFKA_BROKER: kafka:19092
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: eventtracer
  POSTGRES_PASSWORD: eventtracer
  POSTGRES_DB: eventtracer

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: eventtracer-app:local # shared tag → image is built once, reused by all
  profiles: ["apps"]
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy
  environment: *app-env

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: eventtracer-kafka
    restart: unless-stopped # come back after a host reboot (the apps can't run without it)
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"  # localhost only (host apps); not exposed publicly
    environment:
      # --- KRaft identity (no Zookeeper, per ADR-005) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # --- Listeners: use ://:PORT (empty host = bind all interfaces).
      #     Do NOT write 0.0.0.0 here — this image rejects it as an advertised addr. ---
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:19092,EXTERNAL://:9092
      #     EXTERNAL advertises the HOST port so host clients reconnect to the mapped port.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # --- Single-broker settings (can't replicate beyond 1 node) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # --- Heap cap: a single-broker demo needs nowhere near the JVM's default
      #     (which sizes off host RAM). Pinning it keeps Kafka within a small,
      #     predictable footprint so the whole stack fits a 4 GB box. ---
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Probe the INTERNAL listener: EXTERNAL advertises the host port, which
      # isn't reachable from inside the container when KAFKA_HOST_PORT is changed.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    container_name: eventtracer-postgres
    restart: unless-stopped # come back after a host reboot (the apps can't run without it)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"  # localhost only; never expose the DB publicly
    environment:
      POSTGRES_USER: eventtracer
      POSTGRES_PASSWORD: eventtracer
      POSTGRES_DB: eventtracer
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONLY on a fresh data volume (first boot). Creates per-service schemas.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventtracer"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services (profile: apps) --------------------------------
  # The two HTTP apps publish ports; the five pure-Kafka services don't.
  api-gateway:
    <<: *app
    container_name: eventtracer-api-gateway
    command: node dist/apps/api-gateway/main
    environment:
      <<: *app-env
      # 5050, not 5000: macOS's AirPlay Receiver listens on :5000 by default.
      PORT: 5050
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-5050}:5050" # localhost only; put a reverse proxy in front to expose it

  event-monitor:
    <<: *app
    container_name: eventtracer-event-monitor
    command: node dist/apps/event-monitor/main
    environment:
      <<: *app-env
      PORT: 4000
    ports:
      - "127.0.0.1:${MONITOR_PORT:-4000}:4000" # localhost only; put a reverse proxy in front to expose it

  order-service:
    <<: *app
    container_name: eventtracer-order-service
    command: node dist/apps/order-service/main

  payment-service:
    <<: *app
    container_name: eventtracer-payment-service
    command: node dist/apps/payment-service/main

  shipping-service:
    <<: *app
    container_name: eventtracer-shipping-service
    command: node dist/apps/shipping-service/main

  notification-service:
    <<: *app
    container_name: eventtracer-notification-service
    command: node dist/apps/notification-service/main

  refund-service:
    <<: *app
    container_name: eventtracer-refund-service
    command: node dist/apps/refund-service/main

  # The Next.js UI. Built from its own context (not the shared app image). The
  # browser runs on the host, so it reaches the gateway/monitor on localhost via
  # their published ports — the frontend just serves the page on :3001.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Public URLs baked into the client bundle. Default to localhost for local
      # builds (following any host-port override); a server's .env overrides them
      # with its public https origin.
      args:
        NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-http://localhost:${GATEWAY_PORT:-5050}}
        NEXT_PUBLIC_MONITOR_URL: ${NEXT_PUBLIC_MONITOR_URL:-http://localhost:${MONITOR_PORT:-4000}}
    image: eventtracer-frontend:local
    container_name: eventtracer-frontend
    profiles: ["apps"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3001" # localhost only; put a reverse proxy in front to expose it
    depends_on:
      - api-gateway
      - event-monitor

volumes:
  kafka-data:
  postgres-data: